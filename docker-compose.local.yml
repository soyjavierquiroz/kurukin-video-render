services:
  webui:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: moneyprinterturbo-webui
    working_dir: /MoneyPrinterTurbo
    ports:
      - "127.0.0.1:18501:8501"
    command:
      [
        "streamlit",
        "run",
        "./webui/Main.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--browser.serverAddress=127.0.0.1",
        "--server.enableCORS=True",
        "--browser.gatherUsageStats=False",
        "--server.showEmailPrompt=False"
      ]
    volumes:
      - ./config.toml:/MoneyPrinterTurbo/config.toml:ro
      - ./app:/MoneyPrinterTurbo/app:ro
      - ./scripts:/MoneyPrinterTurbo/scripts:ro
      - ./webui:/MoneyPrinterTurbo/webui:ro
      - ./storage:/MoneyPrinterTurbo/storage
      - kurukin-asset-hub_job_assets:/data/job-assets:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/python-pycache
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PEXELS_KEY: ${PEXELS_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      PIXABAY_KEY: ${PIXABAY_KEY:-}
      COVERR_API_KEY: ${COVERR_API_KEY:-}
      COVERR_KEY: ${COVERR_KEY:-}
      KURUKIN_ENABLE_PEXELS_SOURCE: ${KURUKIN_ENABLE_PEXELS_SOURCE:-}
    restart: unless-stopped

  api:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: moneyprinterturbo-api
    working_dir: /MoneyPrinterTurbo
    ports:
      - "127.0.0.1:18080:8080"
    command: ["python3", "main.py"]
    volumes:
      - ./config.toml:/MoneyPrinterTurbo/config.toml:ro
      - ./app:/MoneyPrinterTurbo/app:ro
      - ./storage:/MoneyPrinterTurbo/storage
      - kurukin-asset-hub_job_assets:/data/job-assets:ro
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped

volumes:
  kurukin-asset-hub_job_assets:
    external: true
